<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>FitFindr request flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .fn { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #555; text-anchor: middle; font-style: italic; }
      .lbl { font-size: 11.5px; fill: #444; font-style: italic; }
      .sec { font-size: 11px; fill: #666; letter-spacing: 1.2px; font-weight: 600; }
      .me { fill: #eaf2fb; stroke: #2563a8; stroke-width: 1.5; }
      .cp { fill: #f2f2f2; stroke: #9a9a9a; stroke-width: 1.2; }
      .io { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .ln { stroke: #333; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="490" fill="#fff"/>

  <!-- Caption -->
  <text x="20" y="30" font-size="16" fill="#1a1a1a"><tspan font-weight="700">Figure 1.</tspan> FitFindr request flow</text>

  <!-- Serving layer -->
  <rect x="20" y="50" width="960" height="420" rx="6" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
  <text class="sec" x="36" y="72">SERVING LAYER · FLASK API DEPLOYED ON RENDER</text>

  <!-- Row 1: request and response cache -->
  <rect class="io" x="40" y="90" width="150" height="44" rx="4"/>
  <text class="t" x="115" y="117">User query</text>

  <rect class="cp" x="230" y="90" width="140" height="44" rx="4"/>
  <text class="t fn" x="300" y="117">POST /ask</text>

  <rect class="me" x="410" y="90" width="200" height="44" rx="4"/>
  <text class="t" x="510" y="117">Response cache</text>

  <rect class="me" x="770" y="90" width="190" height="44" rx="4"/>
  <text class="t" x="865" y="117">Return cached result</text>

  <line class="ln" x1="190" y1="112" x2="228" y2="112" marker-end="url(#arrow)"/>
  <line class="ln" x1="370" y1="112" x2="408" y2="112" marker-end="url(#arrow)"/>
  <line class="ln" x1="610" y1="112" x2="768" y2="112" marker-end="url(#arrow)"/>
  <text class="lbl" x="676" y="104">hit</text>
  <line class="ln" x1="510" y1="134" x2="510" y2="178" marker-end="url(#arrow)"/>
  <text class="lbl" x="518" y="161">miss</text>

  <!-- Agent -->
  <rect x="40" y="180" width="920" height="205" rx="6" fill="#fafcff" stroke="#2563a8" stroke-width="1.5"/>
  <text class="sec" x="56" y="200" style="fill:#2563a8">AGENT · <tspan font-family="Menlo, Consolas, monospace">run_agent()</tspan> PLANNING LOOP</text>

  <!-- Row A -->
  <rect class="me" x="60" y="215" width="170" height="56" rx="4"/>
  <text class="t fn" x="145" y="248">① parse_query</text>

  <rect class="me" x="270" y="215" width="180" height="56" rx="4"/>
  <text class="t fn" x="360" y="239">② search_listings</text>
  <text class="s" x="360" y="257">via MCP server</text>

  <polygon points="540,211 600,243 540,275 480,243" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text class="t" x="540" y="240" font-size="12.5">results</text>
  <text class="t" x="540" y="255" font-size="12.5">empty?</text>

  <rect class="me" x="680" y="215" width="260" height="56" rx="4"/>
  <text class="t" x="810" y="248">Stop with a helpful error</text>

  <line class="ln" x1="230" y1="243" x2="268" y2="243" marker-end="url(#arrow)"/>
  <line class="ln" x1="450" y1="243" x2="478" y2="243" marker-end="url(#arrow)"/>
  <line class="ln" x1="600" y1="243" x2="678" y2="243" marker-end="url(#arrow)"/>
  <text class="lbl" x="630" y="235">yes</text>

  <!-- Row B -->
  <line class="ln" x1="540" y1="275" x2="540" y2="303" marker-end="url(#arrow)"/>
  <text class="lbl" x="548" y="293">no</text>

  <rect class="me" x="465" y="305" width="150" height="56" rx="4"/>
  <text class="t" x="540" y="338">③ Select top item</text>

  <rect class="me" x="640" y="305" width="150" height="56" rx="4"/>
  <text class="t fn" x="715" y="329">④ suggest_outfit</text>
  <text class="s" x="715" y="347">via Gemini API</text>

  <rect class="me" x="804" y="305" width="152" height="56" rx="4"/>
  <text class="t fn" x="880" y="329">⑤ create_fit_card</text>
  <text class="s" x="880" y="347">via Gemini API</text>

  <line class="ln" x1="615" y1="333" x2="638" y2="333" marker-end="url(#arrow)"/>
  <line class="ln" x1="790" y1="333" x2="802" y2="333" marker-end="url(#arrow)"/>

  <!-- Response -->
  <rect class="me" x="790" y="410" width="170" height="44" rx="4"/>
  <text class="t" x="875" y="437">Return JSON</text>
  <line class="ln" x1="880" y1="361" x2="880" y2="408" marker-end="url(#arrow)"/>
</svg>
